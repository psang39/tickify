name: Backend tests

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  push:
    branches: [master]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check backend
        run: npm run build

      - name: Start MongoDB, Redis and Kafka test services
        run: |
          docker compose -f docker-compose.test.yml up -d --wait --wait-timeout 120 mongo-test redis-test kafka-test
          docker compose -f docker-compose.test.yml run --rm mongo-init

      - name: Run backend tests
        run: npm test

      - name: Stop test services
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
